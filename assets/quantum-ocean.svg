<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Gusuhanfeng's Quantum Ocean Lab</title>
  <desc id="desc">An original quantum ocean illustration with playful geometric and pixel-game motifs.</desc>
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A2B"/>
      <stop offset="0.55" stop-color="#123A5A"/>
      <stop offset="1" stop-color="#176B87"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE66D"/>
      <stop offset="0.5" stop-color="#7DE2D1"/>
      <stop offset="1" stop-color="#CBA6F7"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#BDE7F0" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#ocean)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="930" cy="130" r="115" fill="#5BE7C4" opacity=".08" filter="url(#soft)"/>
  <circle cx="180" cy="300" r="90" fill="#FF8DC7" opacity=".08" filter="url(#soft)"/>

  <!-- quantum wave -->
  <path d="M34 310 C115 220 170 390 250 300 S390 215 470 304 S610 392 690 298 S830 212 910 302 S1050 390 1166 276" fill="none" stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity=".9"/>
  <path d="M34 326 C115 236 170 406 250 316 S390 231 470 320 S610 408 690 314 S830 228 910 318 S1050 406 1166 292" fill="none" stroke="#D9F8FF" stroke-width="1.5" stroke-dasharray="6 10" opacity=".4"/>

  <!-- playful ocean pair, geometric rather than copied characters -->
  <g transform="translate(82 76)">
    <rect x="0" y="0" width="105" height="105" rx="24" fill="#FFE66D"/>
    <circle cx="24" cy="28" r="8" fill="#FFF4B8"/><circle cx="78" cy="64" r="11" fill="#E7C952"/><circle cx="34" cy="78" r="6" fill="#E7C952"/>
    <path d="M142 94 159 58 198 65 169 39 188 5 154 23 128 0 134 37 100 56 139 60Z" fill="#FF8FB3" stroke="#FFD1DF" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="72" cy="125" r="5" fill="#BDE7F0" opacity=".75"/><circle cx="116" cy="148" r="10" fill="none" stroke="#BDE7F0" stroke-width="3" opacity=".55"/>
  </g>

  <!-- title -->
  <text x="600" y="92" text-anchor="middle" fill="#F4FBFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="5">QUANTUM OCEAN LAB</text>
  <text x="600" y="157" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="750">Gusuhanfeng</text>
  <text x="600" y="198" text-anchor="middle" fill="#BDE7F0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="21">HIT (Shenzhen) · AI for Science · Curious by default</text>
  <rect x="478" y="224" width="244" height="48" rx="24" fill="#071A2B" stroke="#7DE2D1" stroke-opacity=".7"/>
  <text x="600" y="255" text-anchor="middle" fill="#FFE66D" font-family="Georgia, serif" font-size="25" font-style="italic">E = hν</text>

  <!-- abstract atom / Planck motif -->
  <g transform="translate(975 92)" fill="none" stroke="#D9F8FF" opacity=".85">
    <ellipse cx="70" cy="68" rx="70" ry="24" stroke-width="2"/>
    <ellipse cx="70" cy="68" rx="70" ry="24" stroke-width="2" transform="rotate(60 70 68)"/>
    <ellipse cx="70" cy="68" rx="70" ry="24" stroke-width="2" transform="rotate(120 70 68)"/>
    <circle cx="70" cy="68" r="9" fill="#FFE66D" stroke="none"/>
    <circle cx="138" cy="68" r="5" fill="#FF8FB3" stroke="none"/>
  </g>

  <!-- pixel strategy motifs -->
  <g transform="translate(930 292)" shape-rendering="crispEdges">
    <path d="M0 54h18V36h18V18h18V36h18V54h18v36H0Z" fill="#CBA6F7" opacity=".88"/>
    <rect x="32" y="58" width="26" height="32" fill="#071A2B"/>
    <path d="m116 4 12 12-25 25 9 9-12 12-9-9-12 12-8-8 12-12-9-9 12-12 9 9Z" fill="#FFE66D"/>
    <rect x="146" y="58" width="28" height="28" fill="#7DE2D1"/>
    <rect x="178" y="26" width="28" height="28" fill="#FF8FB3"/>
    <rect x="210" y="58" width="28" height="28" fill="#FFE66D"/>
  </g>

  <text x="52" y="390" fill="#BDE7F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" opacity=".75">observe → model → experiment → learn → repeat</text>
  <text x="1148" y="390" text-anchor="end" fill="#BDE7F0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" opacity=".75">PLAYER 01</text>
</svg>
