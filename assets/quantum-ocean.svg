<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Gusuhanfeng — Quantum Ocean Lab</title>
  <desc id="desc">A neon quantum-ocean command deck with playful geometric, physics, and strategy-game motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020617"/><stop offset=".48" stop-color="#071C33"/><stop offset="1" stop-color="#062A3C"/>
    </linearGradient>
    <radialGradient id="portal">
      <stop stop-color="#42F5D1" stop-opacity=".28"/><stop offset=".5" stop-color="#2589FF" stop-opacity=".10"/><stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFE45E"/><stop offset=".32" stop-color="#2EF2D0"/><stop offset=".68" stop-color="#55A7FF"/><stop offset="1" stop-color="#FF75C8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D9FAFF" stop-opacity=".12"/><stop offset="1" stop-color="#D9FAFF" stop-opacity=".025"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6BEEDC" stroke-opacity=".07"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#BFFAFF" opacity=".16"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="30"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <path d="M0 330 1200 205V460H0Z" fill="url(#grid)" opacity=".75"/>
    <ellipse cx="600" cy="280" rx="410" ry="270" fill="url(#portal)"/>
    <circle cx="1040" cy="90" r="105" fill="#9B5CFF" opacity=".08" filter="url(#blur)"/>
    <circle cx="120" cy="340" r="130" fill="#FF4DB8" opacity=".07" filter="url(#blur)"/>

    <!-- HUD corners -->
    <g fill="none" stroke="#70F7E1" stroke-width="2" opacity=".55">
      <path d="M28 92V28h64M1108 28h64v64M28 368v64h64M1108 432h64v-64"/>
    </g>
    <g fill="#70F7E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" opacity=".72">
      <text x="42" y="55">LAB / 01</text><text x="1158" y="55" text-anchor="end">ONLINE</text>
      <text x="42" y="416">HIT · SHENZHEN</text><text x="1158" y="416" text-anchor="end">AI × SCIENCE</text>
    </g>

    <!-- playful ocean duo: original geometric references -->
    <g transform="translate(62 108)" filter="url(#glow)">
      <rect x="10" y="12" width="112" height="112" rx="27" fill="#FFE45E" stroke="#FFF4A8" stroke-width="3"/>
      <g fill="#D5B93D" opacity=".75"><circle cx="36" cy="39" r="8"/><circle cx="91" cy="68" r="13"/><circle cx="43" cy="95" r="6"/></g>
      <path d="m157 118 14-38-29-27 40 1 17-37 12 39 40 5-33 23 8 40-32-24Z" fill="#FF76B5" stroke="#FFC2DE" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="75" cy="151" r="5" fill="#8FF8EA"/><circle cx="136" cy="166" r="11" fill="none" stroke="#8FF8EA" stroke-width="3"/>
    </g>

    <!-- central glass command panel -->
    <rect x="294" y="58" width="612" height="282" rx="24" fill="url(#glass)" stroke="#B9FFF5" stroke-opacity=".2"/>
    <path d="M318 84h34m-34 0v34M882 84h-34m34 0v34M318 314h34m-34 0v-34M882 314h-34m34 0v-34" fill="none" stroke="#70F7E1" stroke-width="2" opacity=".75"/>

    <text x="600" y="112" text-anchor="middle" fill="#8AFBEA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="6">QUANTUM OCEAN LAB</text>
    <text x="600" y="182" text-anchor="middle" fill="#F5FDFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="57" font-weight="800" letter-spacing="1">GUSUHANFENG</text>
    <rect x="405" y="204" width="390" height="1" fill="url(#neon)" filter="url(#glow)"/>
    <text x="600" y="244" text-anchor="middle" fill="#C7EAF2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" letter-spacing="1">AI FOR SCIENCE · CURIOUS BY DEFAULT</text>

    <g transform="translate(452 269)">
      <rect width="296" height="46" rx="23" fill="#020817" stroke="url(#neon)"/>
      <text x="148" y="30" text-anchor="middle" fill="#FFE45E" font-family="Georgia, serif" font-size="22" font-style="italic">E = hν  ·  PLAYER 01</text>
    </g>

    <!-- quantum orbit -->
    <g transform="translate(965 95)" fill="none" stroke="#A6FFF1" filter="url(#glow)">
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7"/>
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7" transform="rotate(60 72 72)"/>
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7" transform="rotate(120 72 72)"/>
      <circle cx="72" cy="72" r="9" fill="#FFE45E" stroke="none"/>
      <circle cx="147" cy="72" r="5" fill="#FF75C8" stroke="none"/>
      <circle cx="34" cy="9" r="4" fill="#55A7FF" stroke="none"/>
    </g>

    <!-- strategy-game skyline -->
    <g transform="translate(948 278)" shape-rendering="crispEdges">
      <path d="M0 48h15V31h15V14h16v17h15v17h16v54H0Z" fill="#8D6BFF" stroke="#C9B9FF" stroke-width="2"/>
      <rect x="25" y="72" width="27" height="30" fill="#071528"/>
      <path d="m107 0 12 12-23 23 9 9-12 12-9-9-14 14-8-8 14-14-9-9 12-12 9 9Z" fill="#FFE45E" filter="url(#glow)"/>
      <rect x="136" y="72" width="22" height="22" fill="#2EF2D0"/><rect x="164" y="44" width="22" height="22" fill="#FF75C8"/><rect x="192" y="72" width="22" height="22" fill="#55A7FF"/>
    </g>

    <!-- luminous probability waves -->
    <path d="M28 366c66-100 126 73 194-12s128-88 196-1 128 87 196-2 128-87 196 0 128 83 196-2 106-53 166 5" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M28 381c66-100 126 73 194-12s128-88 196-1 128 87 196-2 128-87 196 0 128 83 196-2 106-53 166 5" fill="none" stroke="#D7FFFF" stroke-width="1" stroke-dasharray="5 10" opacity=".55"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="29" fill="none" stroke="#70F7E1" stroke-opacity=".3" stroke-width="2"/>
</svg>
