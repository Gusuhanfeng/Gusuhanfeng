<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Gusuhanfeng — Quantum Ocean Lab</title>
  <desc id="desc">A neon quantum-ocean command deck with playful geometric, physics, and strategy-game motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020617"/><stop offset=".48" stop-color="#071C33"/><stop offset="1" stop-color="#062A3C"/>
    </linearGradient>
    <radialGradient id="portal">
      <stop stop-color="#42F5D1" stop-opacity=".28"/><stop offset=".5" stop-color="#2589FF" stop-opacity=".10"/><stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFE45E"/><stop offset=".32" stop-color="#2EF2D0"/><stop offset=".68" stop-color="#55A7FF"/><stop offset="1" stop-color="#FF75C8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D9FAFF" stop-opacity=".12"/><stop offset="1" stop-color="#D9FAFF" stop-opacity=".025"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6BEEDC" stroke-opacity=".07"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#BFFAFF" opacity=".16"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="460" rx="30"/></clipPath>
    <style>
      .chase{animation:chase 4.8s ease-in-out infinite}.bob{animation:bob 1.8s ease-in-out infinite}.jelly{animation:jelly 2.2s ease-in-out infinite}.sword{animation:sword 5s ease-in-out infinite}.bottle{animation:bottle 3s ease-in-out infinite}.dash{animation:dash 7s linear infinite}
      @keyframes chase{0%,100%{transform:translate(-8px,4px)}50%{transform:translate(13px,-5px)}}
      @keyframes bob{0%,100%{transform:translateY(3px) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
      @keyframes jelly{0%,100%{transform:translateY(-7px) scale(1)}50%{transform:translateY(8px) scale(.94,1.06)}}
      @keyframes sword{0%,100%{transform:translate(-12px,8px) rotate(-5deg)}50%{transform:translate(16px,-10px) rotate(3deg)}}
      @keyframes bottle{0%,100%{transform:translateY(4px)}50%{transform:translateY(-8px)}}
      @keyframes dash{to{stroke-dashoffset:-160}}
      @media (prefers-reduced-motion:reduce){.chase,.bob,.jelly,.sword,.bottle,.dash{animation:none}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <rect width="1200" height="460" fill="url(#dots)"/>
    <path d="M0 330 1200 205V460H0Z" fill="url(#grid)" opacity=".75"/>
    <ellipse cx="600" cy="280" rx="410" ry="270" fill="url(#portal)"/>
    <circle cx="1040" cy="90" r="105" fill="#9B5CFF" opacity=".08" filter="url(#blur)"/>
    <circle cx="120" cy="340" r="130" fill="#FF4DB8" opacity=".07" filter="url(#blur)"/>

    <!-- HUD corners -->
    <g fill="none" stroke="#70F7E1" stroke-width="2" opacity=".55">
      <path d="M28 92V28h64M1108 28h64v64M28 368v64h64M1108 432h64v-64"/>
    </g>
    <g fill="#70F7E1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="2" opacity=".72">
      <text x="42" y="55">LAB / 01</text><text x="1158" y="55" text-anchor="end">ONLINE</text>
      <text x="42" y="416">HIT · SHENZHEN</text><text x="1158" y="416" text-anchor="end">AI × SCIENCE</text>
    </g>

    <!-- hand-drawn fan-art chase: sponge, starfish, and jellyfish -->
    <g transform="translate(42 111)" filter="url(#glow)">
      <g class="chase">
      <g class="bob">
        <path d="M18 26Q24 13 39 18q15-9 29 0 17-7 28 7l-3 99q-14 9-27 1-13 8-27 0-14 6-25-4Z" fill="#FFE45E" stroke="#FFF4A8" stroke-width="3"/>
        <g fill="#D5B93D" opacity=".8"><circle cx="31" cy="39" r="6"/><circle cx="79" cy="91" r="9"/><circle cx="37" cy="106" r="5"/></g>
        <ellipse cx="45" cy="56" rx="12" ry="15" fill="#FFF"/><ellipse cx="69" cy="56" rx="12" ry="15" fill="#FFF"/>
        <circle cx="49" cy="58" r="5" fill="#2589FF"/><circle cx="65" cy="58" r="5" fill="#2589FF"/>
        <path d="M45 82q14 13 29 0" fill="none" stroke="#402515" stroke-width="3" stroke-linecap="round"/>
        <path d="M15 124h80v25H15Z" fill="#8B5A34"/><path d="M15 124h80v9H15Z" fill="#FFF"/>
        <path d="M28 149v16m51-16v16M15 68-1 25m82-25 10 20" stroke="#FFE45E" stroke-width="7" stroke-linecap="round"/>
      </g>
      <g transform="translate(105 37)"><g class="bob" style="animation-delay:-.7s">
        <path d="m39 4 15 39 40-11-31 28 25 33-38-20-23 35 7-41-42-5 40-15Z" fill="#FF76B5" stroke="#FFC2DE" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="40" cy="42" r="4" fill="#2B1630"/><circle cx="55" cy="39" r="4" fill="#2B1630"/>
        <path d="M38 54q10 7 20-2" fill="none" stroke="#7C2E57" stroke-width="3" stroke-linecap="round"/>
        <path d="m24 77 29-4 20 17-19 15-29-3Z" fill="#98D84B"/><path d="m38 79 5 11 7-13 7 12" fill="none" stroke="#8D5CD6" stroke-width="4"/>
      </g></g>
      <g transform="translate(211 19)"><g class="jelly">
        <path d="M2 44C2 16 17 3 37 3s35 13 35 41Z" fill="#85F8F0" fill-opacity=".72" stroke="#C8FFFB" stroke-width="3"/>
        <path d="M11 44q7 17 14 0 7 19 14 0 7 18 14 0 7 17 13 0" fill="none" stroke="#FF8DD3" stroke-width="4" stroke-linecap="round"/>
        <path d="M18 50q-9 24 2 36m21-36q10 22-2 39m21-39q-7 18 1 30" fill="none" stroke="#85F8F0" stroke-width="3" stroke-linecap="round"/>
      </g></g>
      <g fill="#8FF8EA"><circle cx="192" cy="28" r="4"><animate attributeName="cy" values="34;5;34" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="181" cy="54" r="2.5"><animate attributeName="cy" values="58;24;58" dur="2s" repeatCount="indefinite"/></circle></g>
      </g>
    </g>

    <!-- central glass command panel -->
    <rect x="294" y="58" width="612" height="282" rx="24" fill="url(#glass)" stroke="#B9FFF5" stroke-opacity=".2"/>
    <path d="M318 84h34m-34 0v34M882 84h-34m34 0v34M318 314h34m-34 0v-34M882 314h-34m34 0v-34" fill="none" stroke="#70F7E1" stroke-width="2" opacity=".75"/>

    <text x="600" y="112" text-anchor="middle" fill="#8AFBEA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="6">QUANTUM OCEAN LAB</text>
    <text x="600" y="182" text-anchor="middle" fill="#F5FDFF" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="57" font-weight="800" letter-spacing="1">GUSUHANFENG</text>
    <rect x="405" y="204" width="390" height="1" fill="url(#neon)" filter="url(#glow)"/>
    <text x="600" y="244" text-anchor="middle" fill="#C7EAF2" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" letter-spacing="1">AI FOR SCIENCE · CURIOUS BY DEFAULT</text>

    <g transform="translate(452 269)">
      <rect width="296" height="46" rx="23" fill="#020817" stroke="url(#neon)"/>
      <text x="148" y="30" text-anchor="middle" fill="#FFE45E" font-family="Georgia, serif" font-size="20" font-style="italic">E = hν · CULTIVATE CURIOSITY</text>
    </g>

    <!-- cultivation motifs: original redraw of a flying sword, spirit bottle, and immortal mountains -->
    <g opacity=".38" fill="#5ACCC0">
      <path d="M914 254q47-65 91 0 39-89 87 0 28-49 70 0v29H914Z"/>
      <path d="M931 254q28-37 55 0m34 0q25-52 52 0" fill="none" stroke="#C8FFFB" stroke-width="2"/>
    </g>
    <g transform="translate(927 233)" filter="url(#glow)"><g class="sword">
      <path d="m0 27 100-20-83 47 15-18Z" fill="#C9F7FF" stroke="#70F7E1" stroke-width="2"/>
      <path d="m20 32-15 16m5-24 17 17" stroke="#FFE45E" stroke-width="5"/>
    </g></g>
    <g transform="translate(1110 180)" filter="url(#glow)"><g class="bottle">
      <path d="M20 0h23l-2 17q17 13 17 38 0 30-27 30T4 55q0-25 18-38Z" fill="#37D78A" fill-opacity=".68" stroke="#A8FFD2" stroke-width="2"/>
      <path d="M15 52q16-12 34 0" fill="none" stroke="#E1FF87" stroke-width="3"/>
      <circle cx="31" cy="51" r="7" fill="#E1FF87" opacity=".75"/>
    </g></g>
    <text x="1148" y="290" text-anchor="end" fill="#A8FFD2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2" opacity=".8">MORTAL PATH // ASCEND</text>

    <!-- quantum orbit -->
    <g transform="translate(965 95)" fill="none" stroke="#A6FFF1" filter="url(#glow)">
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7"/>
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7" transform="rotate(60 72 72)"/>
      <ellipse cx="72" cy="72" rx="78" ry="27" stroke-width="1.7" transform="rotate(120 72 72)"/>
      <circle cx="72" cy="72" r="9" fill="#FFE45E" stroke="none"/>
      <circle cx="147" cy="72" r="5" fill="#FF75C8" stroke="none"/>
      <circle cx="34" cy="9" r="4" fill="#55A7FF" stroke="none"/>
    </g>

    <!-- strategy-game skyline -->
    <g transform="translate(948 278)" shape-rendering="crispEdges">
      <path d="M0 48h15V31h15V14h16v17h15v17h16v54H0Z" fill="#8D6BFF" stroke="#C9B9FF" stroke-width="2"/>
      <rect x="25" y="72" width="27" height="30" fill="#071528"/>
      <path d="m107 0 12 12-23 23 9 9-12 12-9-9-14 14-8-8 14-14-9-9 12-12 9 9Z" fill="#FFE45E" filter="url(#glow)"/>
      <rect x="136" y="72" width="22" height="22" fill="#2EF2D0"/><rect x="164" y="44" width="22" height="22" fill="#FF75C8"/><rect x="192" y="72" width="22" height="22" fill="#55A7FF"/>
    </g>

    <!-- luminous probability waves -->
    <path d="M28 366c66-100 126 73 194-12s128-88 196-1 128 87 196-2 128-87 196 0 128 83 196-2 106-53 166 5" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path class="dash" d="M28 381c66-100 126 73 194-12s128-88 196-1 128 87 196-2 128-87 196 0 128 83 196-2 106-53 166 5" fill="none" stroke="#D7FFFF" stroke-width="1" stroke-dasharray="5 10" opacity=".55"/>
  </g>
  <rect x="1" y="1" width="1198" height="458" rx="29" fill="none" stroke="#70F7E1" stroke-opacity=".3" stroke-width="2"/>
</svg>
