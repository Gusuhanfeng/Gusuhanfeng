<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">Gusuhanfeng's Pixel Valley</title>
  <desc id="desc">A sunny original pixel farm with a cottage, barn, crops, pond, scientist, playful sea friends, flying cultivator, and science motifs.</desc>
  <defs>
    <pattern id="grass" width="32" height="24" patternUnits="userSpaceOnUse"><rect width="32" height="24" fill="#72C85B"/><rect x="5" y="4" width="4" height="4" fill="#98DE72"/><rect x="23" y="15" width="3" height="5" fill="#4FA348"/></pattern>
    <pattern id="water" width="28" height="16" patternUnits="userSpaceOnUse"><rect width="28" height="16" fill="#53C4DF"/><rect x="2" y="5" width="12" height="3" fill="#A4E9F2"/><rect x="19" y="12" width="7" height="2" fill="#319DBE"/></pattern>
    <style>
      .cloud-a{animation:cloud 18s linear infinite}.cloud-b{animation:cloud 24s linear infinite reverse}.bob{animation:bob 1.8s steps(2,end) infinite}.fly{animation:fly 4s ease-in-out infinite}.water{animation:water 2s steps(2,end) infinite}.leaf{animation:leaf 1.5s steps(2,end) infinite}.spark{animation:spark 1.2s steps(2,end) infinite}
      @keyframes cloud{to{transform:translateX(90px)}}@keyframes bob{50%{transform:translateY(-5px)}}@keyframes fly{50%{transform:translate(18px,-10px)}}@keyframes water{50%{transform:translateX(8px)}}@keyframes leaf{50%{transform:rotate(4deg)}}@keyframes spark{50%{opacity:.25}}
      @media(prefers-reduced-motion:reduce){.cloud-a,.cloud-b,.bob,.fly,.water,.leaf,.spark{animation:none}}
    </style>
  </defs>

  <!-- sky and distant valley -->
  <rect width="1200" height="460" rx="24" fill="#82D5F2"/>
  <rect y="0" width="1200" height="92" rx="24" fill="#AEE9F8"/>
  <rect y="88" width="1200" height="58" fill="#93DEF3"/>
  <circle cx="1045" cy="76" r="44" fill="#FFE86E"/><rect x="1037" y="12" width="16" height="24" fill="#FFF2A6"/><rect x="1037" y="116" width="16" height="24" fill="#FFF2A6"/><rect x="981" y="68" width="24" height="16" fill="#FFF2A6"/><rect x="1085" y="68" width="24" height="16" fill="#FFF2A6"/>
  <g class="cloud-a" fill="#FFFDF1"><rect x="72" y="54" width="112" height="28"/><rect x="92" y="38" width="38" height="44"/><rect x="130" y="45" width="32" height="37"/></g>
  <g class="cloud-b" fill="#FFFDF1"><rect x="670" y="74" width="118" height="25"/><rect x="695" y="53" width="40" height="46"/><rect x="735" y="63" width="30" height="36"/></g>
  <path d="M0 210 120 122l104 79 104-105 118 108 112-74 126 79 122-96 125 102 133-81 136 81v82H0Z" fill="#67A89B"/>
  <path d="M0 244 143 157l97 79 106-68 132 78 113-68 114 72 119-68 136 72 105-64 115 58v67H0Z" fill="#8BC37D"/>
  <rect y="245" width="1200" height="215" fill="url(#grass)"/>

  <!-- trees -->
  <g transform="translate(18 195)"><rect x="34" y="78" width="22" height="78" fill="#8A5A37"/><rect x="8" y="42" width="76" height="62" fill="#3C9348"/><rect x="20" y="18" width="54" height="74" fill="#55B85B"/><rect x="34" width="28" height="72" fill="#70C964"/><g fill="#F45B65"><rect x="22" y="54" width="9" height="9"/><rect x="61" y="35" width="9" height="9"/><rect x="50" y="75" width="9" height="9"/></g></g>
  <g transform="translate(1105 210)"><rect x="30" y="72" width="20" height="70" fill="#8A5A37"/><rect x="4" y="34" width="72" height="64" fill="#3C9348"/><rect x="17" y="10" width="49" height="72" fill="#64BC58"/></g>

  <!-- cottage -->
  <g transform="translate(88 228)">
    <rect x="0" y="62" width="174" height="118" fill="#F3C875" stroke="#A86C3F" stroke-width="6"/>
    <path d="M-14 66 87 0l101 66Z" fill="#4E8E78"/><path d="M10 64 87 15l77 49Z" fill="#74B69A"/>
    <rect x="64" y="103" width="48" height="77" fill="#A75A42"/><rect x="73" y="115" width="30" height="28" fill="#78CBE5"/><rect x="18" y="92" width="35" height="39" fill="#9CE1F2" stroke="#FFF2B8" stroke-width="6"/><rect x="126" y="92" width="35" height="39" fill="#9CE1F2" stroke="#FFF2B8" stroke-width="6"/>
    <rect x="134" y="8" width="22" height="45" fill="#A85C42"/><rect x="127" y="2" width="36" height="12" fill="#734635"/>
    <rect x="44" y="150" width="86" height="11" fill="#E9A94F"/>
  </g>

  <!-- barn, silo, and strategy tower -->
  <g transform="translate(934 236)">
    <rect x="0" y="54" width="170" height="130" fill="#D95B4F" stroke="#8F3B38" stroke-width="6"/><path d="M-10 57 85 0l95 57Z" fill="#8F3B38"/><path d="M16 55 85 15l69 40Z" fill="#F7E3B2"/>
    <rect x="55" y="104" width="61" height="80" fill="#7C4037"/><path d="M55 104 116 184M116 104 55 184" stroke="#F0B16A" stroke-width="8"/>
    <rect x="14" y="82" width="31" height="34" fill="#9BE2EF" stroke="#F7E3B2" stroke-width="5"/>
    <path d="M132 10h28v18h18v22h18v134h-64Z" fill="#B8C9C3"/><rect x="126" y="46" width="76" height="12" fill="#809F98"/>
    <g transform="translate(-42 114)"><rect x="0" y="25" width="32" height="45" fill="#8B79C9"/><rect x="6" y="12" width="20" height="18" fill="#A99BE2"/><rect x="12" width="8" height="18" fill="#F5D36A"/></g>
  </g>

  <!-- pond and jellyfish -->
  <g transform="translate(286 322)"><path d="M0 45 28 15h150l28 30-28 63H28Z" fill="#2C8EB1"/><path d="M12 46 34 25h138l21 21-24 49H34Z" fill="url(#water)"/><g class="water" fill="#DFFBFF"><rect x="44" y="53" width="36" height="4"/><rect x="112" y="74" width="45" height="4"/></g><g transform="translate(92 30)"><g class="bob"><rect x="0" y="0" width="28" height="10" fill="#F48BC3"/><rect x="-6" y="10" width="40" height="22" fill="#F7A4D0"/><rect x="0" y="32" width="6" height="18" fill="#E56DB1"/><rect x="15" y="32" width="6" height="22" fill="#E56DB1"/><rect x="28" y="32" width="6" height="16" fill="#E56DB1"/></g></g></g>

  <!-- crop rows -->
  <g transform="translate(720 322)">
    <path d="M0 0h188v112H0Z" fill="#A86C45"/><g stroke="#74452F" stroke-width="5"><path d="M0 28h188M0 56h188M0 84h188"/></g>
    <g class="leaf" fill="#5BAE4B"><path d="M24 18h10V5h8v13h10v9H24ZM85 47h10V34h8v13h10v9H85ZM145 76h10V63h8v13h10v9h-28ZM40 102h10V89h8v13h10v9H40ZM128 20h10V7h8v13h10v9h-28Z"/></g>
    <g fill="#F6D04D"><rect x="34" y="18" width="8" height="8"/><rect x="95" y="47" width="8" height="8"/><rect x="155" y="76" width="8" height="8"/><rect x="50" y="102" width="8" height="8"/><rect x="138" y="20" width="8" height="8"/></g>
  </g>

  <!-- wooden title sign -->
  <g transform="translate(342 112)">
    <rect x="18" y="15" width="502" height="128" fill="#7C4A32"/><rect x="0" y="0" width="538" height="128" fill="#B56C3E" stroke="#633D2B" stroke-width="8"/>
    <rect x="17" y="17" width="504" height="94" fill="#D78B4B"/><rect x="38" y="128" width="24" height="52" fill="#70432F"/><rect x="476" y="128" width="24" height="52" fill="#70432F"/>
    <g fill="#FFE7A8"><rect x="22" y="21" width="8" height="8"/><rect x="508" y="21" width="8" height="8"/><rect x="22" y="98" width="8" height="8"/><rect x="508" y="98" width="8" height="8"/></g>
    <text x="269" y="61" text-anchor="middle" fill="#FFF3BF" stroke="#633D2B" stroke-width="2" paint-order="stroke" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="40" font-weight="900">GUSUHANFENG</text>
    <text x="269" y="92" text-anchor="middle" fill="#FFF8DC" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" letter-spacing="2">PIXEL VALLEY · AI FOR SCIENCE</text>
  </g>

  <!-- pixel friends -->
  <g transform="translate(204 347)">
    <g class="bob"><rect x="0" y="0" width="42" height="50" fill="#FFE45E"/><rect x="7" y="10" width="10" height="12" fill="#FFF"/><rect x="25" y="10" width="10" height="12" fill="#FFF"/><rect x="11" y="14" width="5" height="5" fill="#3B7BD8"/><rect x="26" y="14" width="5" height="5" fill="#3B7BD8"/><rect x="5" y="50" width="32" height="12" fill="#8A5437"/><rect x="8" y="62" width="7" height="12" fill="#FFE45E"/><rect x="27" y="62" width="7" height="12" fill="#FFE45E"/></g>
    <g transform="translate(54 16)"><g class="bob" style="animation-delay:-.7s"><path d="M20 0h12v14h14v12H34v14H18V27H4V15h16Z" fill="#F48BB4"/><rect x="9" y="39" width="30" height="13" fill="#9BCB55"/><rect x="16" y="15" width="5" height="5" fill="#563344"/><rect x="29" y="15" width="5" height="5" fill="#563344"/></g></g>
  </g>

  <!-- scientist farmer -->
  <g transform="translate(600 338)"><g class="bob"><rect x="14" y="0" width="30" height="28" fill="#E6B08A"/><rect x="10" y="4" width="38" height="9" fill="#5B3D35"/><rect x="8" y="28" width="44" height="55" fill="#FFF8DF"/><rect x="22" y="32" width="6" height="44" fill="#72B9D5"/><rect x="13" y="83" width="14" height="22" fill="#416B8B"/><rect x="34" y="83" width="14" height="22" fill="#416B8B"/><path d="M52 45h12v18H52Z" fill="#E6B08A"/><path d="M62 47h13v20H59Z" fill="#7C76D8"/><rect x="63" y="42" width="8" height="6" fill="#A9A5F3"/><rect x="61" y="57" width="12" height="8" fill="#66D7BB"/></g></g>

  <!-- flying cultivator and quantum stars -->
  <g transform="translate(782 62)"><g class="fly"><path d="M0 46h115l-31 10H13Z" fill="#D9E4E1"/><rect x="48" y="13" width="18" height="30" fill="#497D62"/><rect x="50" y="0" width="14" height="15" fill="#E0B38D"/><rect x="42" y="8" width="30" height="7" fill="#354C42"/><path d="m66 20 29-17 5 6-28 20Z" fill="#67A878"/><rect x="110" y="42" width="18" height="4" fill="#FFE66D"/></g></g>
  <g class="spark" fill="#FFF3A0"><rect x="735" y="55" width="8" height="8"/><rect x="890" y="91" width="6" height="6"/><rect x="925" y="45" width="10" height="10"/></g>

  <!-- footer pixels -->
  <rect x="0" y="448" width="1200" height="12" rx="0" fill="#4B9B45"/>
  <text x="18" y="442" fill="#2D6F3C" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700">DAY 01 · FARMING QUESTIONS · HARVESTING DISCOVERIES</text>
</svg>
