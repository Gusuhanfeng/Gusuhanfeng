  <!-- arc reactor -->
  <circle class="reactor" cx="76" cy="42" r="8" fill="#D8FCFF" stroke="#70DCE9" stroke-width="3"/><circle cx="76" cy="42" r="3" fill="#FFFFFF" stroke="none"/>
