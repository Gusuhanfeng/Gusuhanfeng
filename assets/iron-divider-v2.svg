<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
<style>.fly{animation:fly 6.8s linear infinite}.jet{animation:jet .45s steps(2,end) infinite}.reactor{animation:reactor .8s steps(2,end) infinite}.dash{animation:dash 3s linear infinite}@keyframes fly{from{transform:translateX(-150px)}to{transform:translateX(930px)}}@keyframes jet{50%{transform:scaleX(.68);opacity:.55}}@keyframes reactor{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){.fly,.jet,.reactor,.dash{animation:none}.fly{transform:translateX(390px)}}</style>
<path d="M18 72H882" stroke="#326F7B" stroke-width="5"/><path class="dash" d="M18 68H882" stroke="#7CE3EF" stroke-width="2" stroke-dasharray="14 8"/>
