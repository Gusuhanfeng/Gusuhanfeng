<svg xmlns="http://www.w3.org/2000/svg" width="900" height="82" viewBox="0 0 900 82" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
<style>.fly{animation:fly 6.8s linear infinite}.jet{animation:jet .45s steps(2,end) infinite}.reactor{animation:reactor .8s steps(2,end) infinite}.dash{animation:dash 3s linear infinite}@keyframes fly{from{transform:translateX(-130px)}to{transform:translateX(925px)}}@keyframes jet{50%{transform:scaleX(.65);opacity:.55}}@keyframes reactor{50%{opacity:.35}}@keyframes dash{to{stroke-dashoffset:-64}}@media(prefers-reduced-motion:reduce){.fly,.jet,.reactor,.dash{animation:none}.fly{transform:translateX(400px)}}</style>
<path d="M18 63H882" stroke="#3E7D88" stroke-width="4"/><path class="dash" d="M18 59H882" stroke="#79E4F2" stroke-width="2" stroke-dasharray="14 8"/>
<g><g class="fly">
  <!-- boot and palm jets -->
  <g class="jet" style="transform-origin:28px 40px"><rect x="-20" y="31" width="30" height="7" fill="#7CE7F4"/><rect x="-34" y="33" width="14" height="4" fill="#D9FBFF"/><rect x="-15" y="51" width="25" height="6" fill="#7CE7F4"/><rect x="-28" y="52" width="13" height="4" fill="#D9FBFF"/></g>
  <!-- legs and torso -->
  <rect x="8" y="28" width="33" height="12" fill="#A8242F"/><rect x="5" y="42" width="38" height="12" fill="#C43A34"/><rect x="34" y="20" width="30" height="34" fill="#B5222E"/><rect x="41" y="24" width="17" height="22" fill="#E4A83D"/>
  <rect class="reactor" x="46" y="30" width="8" height="8" fill="#C8FAFF"/><rect x="43" y="27" width="14" height="14" fill="none" stroke="#68DCEB" stroke-width="2"/>
  <!-- helmet -->
  <rect x="55" y="6" width="22" height="20" fill="#B5222E"/><rect x="60" y="9" width="17" height="14" fill="#E4A83D"/><rect x="65" y="13" width="9" height="4" fill="#78E8F2"/><rect x="58" y="3" width="16" height="5" fill="#8F1D2A"/>
  <!-- forward arm -->
  <rect x="62" y="27" width="31" height="10" fill="#C43A34"/><rect x="87" y="25" width="22" height="10" fill="#E4A83D"/><rect x="105" y="23" width="8" height="14" fill="#A8242F"/><rect x="112" y="26" width="5" height="8" fill="#C8FAFF"/>
  <!-- rear arm -->
  <rect x="27" y="18" width="12" height="21" fill="#C43A34"/><rect x="22" y="12" width="10" height="11" fill="#E4A83D"/>
  <g class="reactor" fill="#9AF0F7"><rect x="120" y="17" width="5" height="5"/><rect x="130" y="28" width="4" height="4"/></g>
</g></g>
</svg>
