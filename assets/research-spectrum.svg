<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
  <title id="title">AI for Science research spectrum</title>
  <desc id="desc">A colorful path from observation through representation and prediction to experiment and discovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A1024"/><stop offset=".5" stop-color="#13263D"/><stop offset="1" stop-color="#0A3038"/></linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFE66D"/><stop offset=".34" stop-color="#FF7A90"/><stop offset=".67" stop-color="#4DE2C5"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient>
    <radialGradient id="a"><stop stop-color="#FFE66D" stop-opacity=".23"/><stop offset="1" stop-color="#FFE66D" stop-opacity="0"/></radialGradient>
    <radialGradient id="b"><stop stop-color="#FF5DA2" stop-opacity=".2"/><stop offset="1" stop-color="#FF5DA2" stop-opacity="0"/></radialGradient>
    <radialGradient id="c"><stop stop-color="#4DE2C5" stop-opacity=".2"/><stop offset="1" stop-color="#4DE2C5" stop-opacity="0"/></radialGradient>
    <radialGradient id="d"><stop stop-color="#9B7BFF" stop-opacity=".22"/><stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="31" height="31" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#D8FFFF" opacity=".13"/></pattern>
    <style>.flow{animation:flow 6s linear infinite}.pulse{animation:pulse 2.5s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-120}}@keyframes pulse{50%{opacity:.58;transform:scale(.94)}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style>
  </defs>
  <rect x="1" y="1" width="898" height="218" rx="22" fill="url(#bg)" stroke="url(#spectrum)" stroke-opacity=".58" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="218" rx="22" fill="url(#stars)"/>
  <ellipse cx="115" cy="116" rx="135" ry="100" fill="url(#a)"/><ellipse cx="340" cy="105" rx="135" ry="100" fill="url(#b)"/><ellipse cx="560" cy="114" rx="135" ry="100" fill="url(#c)"/><ellipse cx="785" cy="105" rx="135" ry="100" fill="url(#d)"/>
  <text x="450" y="30" text-anchor="middle" fill="#C8E8EF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="4">RESEARCH SPECTRUM // AI FOR SCIENCE</text>
  <path d="M92 105C180 50 250 166 340 105S485 50 560 105 700 166 808 102" fill="none" stroke="url(#spectrum)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <path class="flow" d="M92 105C180 50 250 166 340 105S485 50 560 105 700 166 808 102" fill="none" stroke="#F3FFFF" stroke-width="1.4" stroke-dasharray="6 9" opacity=".72"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" text-anchor="middle">
    <g transform="translate(118 95)"><circle class="pulse" r="25" fill="#FFE66D"/><circle r="15" fill="#11172A"/><text y="6" fill="#FFE66D" font-size="17" font-weight="700">01</text></g>
    <text x="118" y="151" fill="#FFE66D" font-size="16" font-weight="700">OBSERVE</text><text x="118" y="172" fill="#C9DDE4" font-size="10">find the signal</text>
    <g transform="translate(340 105)"><circle class="pulse" r="25" fill="#FF7A90" style="animation-delay:-.6s"/><circle r="15" fill="#11172A"/><text y="6" fill="#FF7A90" font-size="17" font-weight="700">02</text></g>
    <text x="340" y="151" fill="#FF7A90" font-size="16" font-weight="700">REPRESENT</text><text x="340" y="172" fill="#C9DDE4" font-size="10">encode the structure</text>
    <g transform="translate(560 105)"><circle class="pulse" r="25" fill="#4DE2C5" style="animation-delay:-1.2s"/><circle r="15" fill="#11172A"/><text y="6" fill="#4DE2C5" font-size="17" font-weight="700">03</text></g>
    <text x="560" y="151" fill="#4DE2C5" font-size="16" font-weight="700">PREDICT</text><text x="560" y="172" fill="#C9DDE4" font-size="10">make it testable</text>
    <g transform="translate(782 95)"><circle class="pulse" r="25" fill="#9B7BFF" style="animation-delay:-1.8s"/><circle r="15" fill="#11172A"/><text y="6" fill="#9B7BFF" font-size="17" font-weight="700">04</text></g>
    <text x="782" y="151" fill="#B99BFF" font-size="16" font-weight="700">EXPERIMENT</text><text x="782" y="172" fill="#C9DDE4" font-size="10">let evidence decide</text>
  </g>
  <text x="450" y="203" text-anchor="middle" fill="#7FAAB4" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing="2">NEW EVIDENCE → NEW UNDERSTANDING → REPEAT</text>
</svg>
